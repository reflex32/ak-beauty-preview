<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שובר מתנה · AK Beauty Academy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24160f">
<meta property="og:title" content="יש לך מתנה · AK Beauty Academy">
<meta property="og:description" content="שובר מתנה לטיפול אצל אביגיל, רמת גן">
<link rel="icon" type="image/png" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root { --cream: #f8f2ec; --brown: #5c3422; --espresso: #24160f; --gold: #e8c4aa; --rose: #c8998a; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100svh; font-family: 'Heebo', system-ui, sans-serif; color: #f3e3d6; background: radial-gradient(120% 70% at 50% 0%, #4a2c1f 0%, #24160f 60%, #1a100b 100%); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .orb { position: fixed; z-index: 0; border-radius: 50%; filter: blur(40px); pointer-events: none; animation: drift 16s ease-in-out infinite alternate; }
  .orb.a { top: -10%; right: -20%; width: 70vw; height: 70vw; background: radial-gradient(closest-side, rgba(200, 153, 138, .35), transparent); }
  .orb.b { bottom: -15%; left: -25%; width: 80vw; height: 80vw; background: radial-gradient(closest-side, rgba(232, 196, 170, .18), transparent); animation-delay: -8s; }
  @keyframes drift { to { transform: translate(6%, 4%) scale(1.08); } }
  .icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icon.fill { fill: currentColor; stroke: none; }
  main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; min-height: 100svh; padding: 26px 16px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  .logo { display: block; width: 52px; color: var(--gold); margin-bottom: 24px; }
  .logo svg { display: block; width: 100%; height: auto; fill: currentColor; }
  .hello { margin: 0; font-size: 15px; font-weight: 400; color: rgba(243, 227, 214, .75); animation: rise .8s .1s var(--ease) both; }
  h1 { margin: 4px 0 26px; font-size: clamp(34px, 10vw, 46px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; background: linear-gradient(180deg, #fff3e8, #e8c4aa); -webkit-background-clip: text; background-clip: text; color: transparent; animation: rise .8s .2s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  /* the card: back (closed) and front (the voucher) */
  .scene { width: 100%; max-width: 420px; perspective: 1400px; animation: rise .9s .3s var(--ease) both; }
  .flip { position: relative; aspect-ratio: 1.6; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.3, 1.3, .4, 1); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { translate: 0 -8px; } }
  .flip.open { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 40px 70px -36px rgba(0, 0, 0, .9); }
  .back { display: grid; place-items: center; background: radial-gradient(90% 120% at 50% 0%, #9a6a52 0%, #5c3422 45%, #2e1b12 100%); }
  .back::before { content: ''; position: absolute; inset: 0; opacity: .14; background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 16px 16px; }
  .back svg { width: 34%; fill: var(--gold); filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .35)); }
  .back .ribbon { position: absolute; inset: 0; pointer-events: none; }
  .back .ribbon::before, .back .ribbon::after { content: ''; position: absolute; background: linear-gradient(90deg, rgba(232, 196, 170, .0), rgba(232, 196, 170, .55), rgba(232, 196, 170, .0)); }
  .back .ribbon::before { top: 0; bottom: 0; left: 50%; width: 2px; }
  .back .ribbon::after { left: 0; right: 0; top: 50%; height: 2px; }
  .front { transform: rotateY(180deg); display: flex; flex-direction: column; padding: 18px 20px 16px; text-align: right; color: #f3e3d6; background: radial-gradient(120% 140% at 88% -10%, #8a5a43 0%, #4a2c1f 42%, #24160f 100%); }
  .foil { position: absolute; inset: 8px; border-radius: 16px; border: 1px solid rgba(232, 196, 170, .45); pointer-events: none; }
  .sheen { position: absolute; inset: -40%; pointer-events: none; background: linear-gradient(110deg, transparent 38%, rgba(255, 228, 206, .22) 48%, transparent 62%); transform: translateX(-60%); animation: sheen 6.5s 1.4s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { transform: translateX(-60%); } 85%, 100% { transform: translateX(60%); } }
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .kind { font-size: 12.5px; font-weight: 500; letter-spacing: .14em; color: var(--gold); }
  .mono { width: 34px; height: auto; fill: var(--gold); }
  .amount { position: relative; display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; margin: auto 0 0; direction: ltr; font-weight: 800; line-height: 1; }
  .amount span { font-size: 24px; color: var(--gold); }
  .amount b { font-size: clamp(46px, 14vw, 60px); letter-spacing: -.02em; background: linear-gradient(180deg, #fff3e8 0%, #e8c4aa 70%, #c99a7c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .names { position: relative; display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; font-size: 15px; font-weight: 600; color: #fff3e8; }
  .names i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: .7; }
  .bottom { position: relative; display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(232, 196, 170, .22); font-size: 11.5px; letter-spacing: .04em; color: rgba(232, 196, 170, .9); }
  .code { direction: ltr; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
  .stamp { position: absolute; top: 46%; left: 50%; padding: 6px 16px; border: 2px solid var(--gold); border-radius: 10px; font-size: 22px; font-weight: 800; color: var(--gold); background: rgba(36, 22, 15, .7); transform: translate(-50%, -50%) rotate(-10deg); }
  .open-btn { margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 26px; border-radius: 99px; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; transition: transform .2s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.gold { color: #2a1810; background: linear-gradient(180deg, #f6dcc8, #d9a98b); box-shadow: 0 16px 34px -16px rgba(217, 169, 139, .7); }
  .btn.line { color: #f3e3d6; background: rgba(255, 255, 255, .06); border: 1px solid rgba(232, 196, 170, .35); }
  .open-btn { animation: rise .8s .6s var(--ease) both, pulse 2.4s 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 16px 40px -10px rgba(232, 196, 170, .65); } }
  .details { width: 100%; max-width: 420px; margin-top: 26px; }
  .details[hidden] { display: none; }
  .details > * { animation: rise .7s var(--ease) both; }
  .msg { margin: 0 0 20px; font-size: 20px; font-weight: 300; line-height: 1.5; color: #fff3e8; }
  .msg small { display: block; margin-top: 6px; font-size: 14px; color: rgba(243, 227, 214, .65); }
  .how { margin: 0 0 16px; padding: 14px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; color: rgba(243, 227, 214, .85); background: rgba(255, 255, 255, .05); border: 1px solid rgba(232, 196, 170, .16); }
  .how b { color: var(--gold); font-weight: 600; }
  .actions { display: grid; gap: 10px; }
  .legal { margin: 18px 0 0; font-size: 12px; line-height: 1.7; color: rgba(243, 227, 214, .55); }
  .note { max-width: 32ch; margin: 18px auto 0; font-size: 15px; line-height: 1.6; color: rgba(243, 227, 214, .8); }
  .spark { position: fixed; z-index: 3; width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #fff3e8, #e8c4aa 60%, transparent 70%); pointer-events: none; animation: spark 1.6s var(--d) cubic-bezier(.2, .8, .3, 1) forwards; opacity: 0; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); } }
  .foot { margin: auto 0 0; padding-top: 28px; font-size: 12.5px; color: rgba(243, 227, 214, .5); }
  .load { display: flex; gap: 6px; padding: 80px 0; } .load i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: dot 1.1s infinite; } .load i:nth-child(2) { animation-delay: .15s; } .load i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-6px); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ak" viewBox="110 40 716 546"><polygon points="119.6,576 151.6,576 518,169.3 518,576 540,576 540,111"/><polygon points="816,50.2 816,87.5 605.2,333.2 815.2,576 783.2,576 573.2,333.2"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v8h14v-8M12 8.5v12M12 8.5C10 4 6.5 5 7.5 7.2 8.3 8.7 12 8.5 12 8.5zM12 8.5c2-4.5 5.5-3.5 4.5-1.3-.8 1.5-4.5 1.3-4.5 1.3z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></symbol>
</defs></svg>
<i class="orb a"></i><i class="orb b"></i>
<main id="vx">
  <a class="logo" href="index.html" aria-label="AK Beauty Academy"><svg viewBox="110 40 716 546"><use href="#ak"/></svg></a>
  <div class="load" aria-label="טוען"><i></i><i></i><i></i></div>
</main>
<script>
(() => {
  'use strict';
  const API = window.AK_API || '';
  const WA = '972502774797';
  const box = document.getElementById('vx');
  const code = (new URLSearchParams(location.search).get('v') || '').trim().toUpperCase();
  const demo = !API || /^DEMO/.test(code);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const he = (ymd) => ymd ? `${+ymd.slice(8)}.${+ymd.slice(5, 7)}.${ymd.slice(0, 4)}` : '';
  const logo = '<a class="logo" href="index.html" aria-label="AK Beauty Academy"><svg viewBox="110 40 716 546"><use href="#ak"/></svg></a>';
  const foot = '<p class="foot">AK Beauty Academy · בית הרופאים, גילדסגיים 4, רמת גן</p>';
  const wa = (text) => `https://wa.me/${WA}?text=${encodeURIComponent(text)}`;

  const front = (v, stamp) => `
    <div class="face front">
      <span class="foil"></span><span class="sheen"></span>
      <div class="top"><span class="kind">שובר מתנה</span><svg class="mono" viewBox="110 40 716 546"><use href="#ak"/></svg></div>
      <p class="amount"><span>₪</span><b>${Number(v.amount).toLocaleString('he-IL')}</b></p>
      <p class="names"><span>ל${esc(v.to)}</span><i></i><span>מ${esc(v.from)}</span></p>
      <div class="bottom"><span class="code">${esc(v.code)}</span><span>בתוקף עד ${he(v.valid)}</span></div>
      ${stamp ? `<span class="stamp">${stamp}</span>` : ''}
    </div>`;

  const sparks = () => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = document.querySelector('.scene').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 34; i++) {
      const s = document.createElement('i'); s.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
      s.style.cssText = `left:${cx}px;top:${cy}px;--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 40}px;--s:${3 + Math.random() * 6}px;--d:${Math.random() * 0.25}s`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
    }
  };

  const render = (v) => {
    if (v.state === 'active' || v.state === 'used' || v.state === 'expired') {
      const stamp = v.state === 'used' ? 'נוצל' : v.state === 'expired' ? 'פג תוקף' : '';
      const book = `index.html?bknote=${encodeURIComponent('שובר מתנה ' + v.code)}#treat`;
      box.innerHTML = `${logo}
        <p class="hello">${stamp ? 'השובר' : 'היי ' + esc(v.to) + ','}</p>
        <h1>${stamp ? (v.state === 'used' ? 'השובר כבר נוצל' : 'תוקף השובר עבר') : 'יש לך מתנה'}</h1>
        <div class="scene"><div class="flip${stamp ? ' open' : ''}" id="flip">
          <div class="face back"><span class="ribbon"></span><svg viewBox="110 40 716 546"><use href="#ak"/></svg></div>
          ${front(v, stamp)}
        </div></div>
        ${stamp ? `<p class="note">שאלות? <a href="${wa('היי אביגיל, לגבי שובר מתנה ' + v.code)}" target="_blank" rel="noopener" style="color:#e8c4aa">כתבי לאביגיל</a></p>`
          : `<button type="button" class="btn gold open-btn" id="openBtn"><svg class="icon"><use href="#i-gift"/></svg>לפתוח את המתנה</button>`}
        <div class="details" id="details" hidden>
          ${v.message ? `<p class="msg">״${esc(v.message)}״<small>${esc(v.from)}</small></p>` : ''}
          <p class="how">השובר שווה <b>₪${Number(v.amount).toLocaleString('he-IL')}</b> לכל טיפול אצל אביגיל, בקליניקה ברמת גן. קובעים תור באתר, והקוד כבר יופיע בהערה.</p>
          <div class="actions">
            <a class="btn gold" href="${book}"><svg class="icon"><use href="#i-cal"/></svg>לקביעת תור עם השובר</a>
            <a class="btn line" href="${wa('היי אביגיל, קיבלתי שובר מתנה (' + v.code + ') ואשמח לקבוע תור')}" target="_blank" rel="noopener"><svg class="icon fill"><use href="#i-wa"/></svg>או לכתוב לאביגיל</a>
          </div>
          <p class="legal">קוד ${esc(v.code)} · הונפק ${he(v.issued)} · בתוקף עד ${he(v.valid)}<br>הסכום מקוזז ממחיר הטיפול.</p>
        </div>
        ${foot}`;
      const btn = document.getElementById('openBtn');
      if (btn) btn.addEventListener('click', () => {
        document.getElementById('flip').classList.add('open'); btn.remove();
        setTimeout(sparks, 420);
        setTimeout(() => { const d = document.getElementById('details'); d.hidden = false; d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 900);
      });
    } else if (v.state === 'pending') {
      box.innerHTML = `${logo}<h1>השובר עוד לא פעיל</h1><p class="note">הוא נפתח מיד אחרי שהתשלום מגיע לאביגיל. שאלות?</p><a class="btn line" href="${wa('היי אביגיל, לגבי שובר מתנה ' + code)}" target="_blank" rel="noopener" style="margin-top:14px"><svg class="icon fill"><use href="#i-wa"/></svg>לכתוב לאביגיל</a>${foot}`;
    } else {
      box.innerHTML = `${logo}<h1>לא מצאתי את השובר</h1><p class="note">אולי הקישור לא הועתק עד הסוף. כתבי לאביגיל ונבדוק.</p><a class="btn line" href="${wa('היי אביגיל, ניסיתי לפתוח שובר מתנה')}" target="_blank" rel="noopener" style="margin-top:14px"><svg class="icon fill"><use href="#i-wa"/></svg>לכתוב לאביגיל</a>${foot}`;
    }
  };

  if (demo) {
    const d = new Date(), p = (n) => String(n).padStart(2, '0'), today = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    const state = code === 'DEMO-USED' ? 'used' : code === 'DEMO-PENDING' ? 'pending' : 'active';
    render({ state, code: 'AK-7K3P9Q', amount: 300, to: 'מיכל', from: 'נועה', message: 'מזל טוב אחותי, מגיע לך פינוק אמיתי', issued: today, valid: `${d.getFullYear() + 5}-${p(d.getMonth() + 1)}-${p(d.getDate())}` });
    return;
  }
  if (!/^AK-[A-Z0-9]{6}$/.test(code)) return render({ state: 'notfound' });
  fetch(`${API}?action=voucher&v=${encodeURIComponent(code)}`).then((r) => r.json()).then((v) => render(v && v.ok ? v : { state: 'notfound' })).catch(() => render({ state: 'notfound' }));
})();
</script>
</body>
</html>
