<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ביטול תור · AK Beauty Academy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8f2ec">
<link rel="icon" type="image/png" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root { --cream: #f8f2ec; --brown: #5c3422; --espresso: #24160f; --rose: #c8998a; --rose-deep: #a8705f; --ink: #2b1e17; --muted: #7d6a5f; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100svh; font-family: 'Heebo', system-ui, sans-serif; color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: fixed; inset: -20% -30% auto; height: 70%; z-index: -1; background: radial-gradient(closest-side, rgba(236, 196, 178, .55), rgba(236, 196, 178, 0)); filter: blur(10px); }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cx { display: flex; flex-direction: column; align-items: center; min-height: 100svh; padding: 28px 16px calc(24px + env(safe-area-inset-bottom)); }
  .cx-logo { display: block; width: 58px; color: var(--brown); margin-bottom: 26px; }
  .cx-logo svg { display: block; width: 100%; height: auto; fill: currentColor; }
  .cx-card { position: relative; width: 100%; max-width: 420px; padding: 30px 22px 24px; border-radius: 30px; text-align: center; background: rgba(255, 252, 249, .72); border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 30px 70px -40px rgba(92, 52, 34, .55); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: rise .7s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .cx-card h1 { margin: 0 0 18px; font-size: 22px; font-weight: 600; line-height: 1.35; color: var(--brown); }
  .cx-tk { position: relative; margin: 0 auto 20px; padding: 20px 16px 18px; max-width: 280px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px rgba(92, 52, 34, .08), 0 18px 34px -24px rgba(92, 52, 34, .5); }
  .cx-tk p { margin: 0; transition: opacity .6s; }
  .cx-day { font-size: 14px; color: var(--muted); }
  .cx-num { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--brown); }
  .cx-month { font-size: 16px; font-weight: 500; color: var(--brown); }
  .cx-time { margin-top: 8px !important; font-size: 18px; font-weight: 600; direction: ltr; color: var(--ink); }
  .cx-rule { display: block; width: 40px; height: 1px; margin: 14px auto 12px; background: rgba(168, 112, 95, .5); }
  .cx-treat { font-size: 14.5px; color: var(--muted); }
  .cx-stamp { position: absolute; top: 46%; left: 50%; padding: 6px 16px; border: 2px solid var(--rose-deep); border-radius: 10px; font-size: 22px; font-weight: 800; letter-spacing: .06em; color: var(--rose-deep); background: rgba(255, 255, 255, .85); transform: translate(-50%, -50%) rotate(-12deg) scale(1.6); opacity: 0; transition: transform .5s cubic-bezier(.34, 1.56, .64, 1), opacity .3s; pointer-events: none; }
  .cx-tk.void .cx-num, .cx-tk.void .cx-time, .cx-tk.void .cx-month { opacity: .3; }
  .cx-tk.void .cx-stamp { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
  .cx-txt { margin: 0 auto 16px; max-width: 32ch; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .cx-txt b { color: var(--brown); font-weight: 600; }
  .cx-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; margin-top: 10px; padding: 0 20px; border-radius: 99px; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; transition: transform .2s var(--ease), opacity .2s; -webkit-tap-highlight-color: transparent; }
  .cx-btn:active { transform: scale(.97); }
  .cx-btn.dark { color: #fff; background: var(--brown); box-shadow: 0 16px 30px -18px rgba(92, 52, 34, .8); }
  .cx-btn.line { color: var(--brown); background: transparent; border: 1px solid rgba(92, 52, 34, .28); }
  .cx-btn.busy { pointer-events: none; opacity: .75; }
  .cx-btn.busy::after { content: ''; width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-left-color: transparent; animation: spin .8s linear infinite; }
  .cx-btn .icon.fill { fill: currentColor; stroke: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cx-note { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  .cx-note .icon { width: 15px; height: 15px; }
  .cx-ask { margin: 0 0 4px; font-size: 17px; font-weight: 600; color: var(--brown); }
  .cx-load { display: flex; justify-content: center; gap: 6px; padding: 60px 0; }
  .cx-load i { width: 8px; height: 8px; border-radius: 50%; background: var(--rose); animation: dot 1.1s ease-in-out infinite; }
  .cx-load i:nth-child(2) { animation-delay: .15s; } .cx-load i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-6px); opacity: .5; } }
  .cx-foot { margin: auto 0 0; padding-top: 26px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .cx-in { animation: rise .5s var(--ease) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ak" viewBox="110 40 716 546"><polygon points="119.6,576 151.6,576 518,169.3 518,576 540,576 540,111"/><polygon points="816,50.2 816,87.5 605.2,333.2 815.2,576 783.2,576 573.2,333.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7.5"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.5V12l3 2"/></symbol>
  </defs>
</svg>
<main class="cx">
  <a class="cx-logo" href="index.html" aria-label="AK Beauty Academy, לעמוד הבית"><svg viewBox="110 40 716 546"><use href="#ak"/></svg></a>
  <section class="cx-card" id="cx" aria-live="polite"><div class="cx-load" aria-label="טוען"><i></i><i></i><i></i></div></section>
  <p class="cx-foot">AK Beauty Academy · בית הרופאים, גילדסגיים 4, רמת גן</p>
</main>
<script>
(() => {
  'use strict';
  const API = window.AK_API || '';
  const WA = '972502774797';
  const MONTH = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
  const box = document.getElementById('cx');
  const t = new URLSearchParams(location.search).get('t') || '';
  const demo = !API || /^demo/.test(t); // preview: a sample appointment, nothing is sent
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const waLink = (text) => `https://wa.me/${WA}${text ? '?text=' + encodeURIComponent(text) : ''}`;
  const short = (b) => `יום ${b.day} ${+b.date.slice(8)}.${+b.date.slice(5, 7)} בשעה ${b.time}`;
  const show = (html) => { box.innerHTML = `<div class="cx-in">${html}</div>`; };
  const ticket = (b) => `
    <div class="cx-tk" id="cxTk">
      <p class="cx-day">יום ${esc(b.day)}</p>
      <p class="cx-num">${+b.date.slice(8)}</p>
      <p class="cx-month">${MONTH[+b.date.slice(5, 7) - 1]}</p>
      <p class="cx-time"><bdi>${esc(b.time)}${b.end ? ' — ' + esc(b.end) : ''}</bdi></p>
      <span class="cx-rule"></span>
      <p class="cx-treat">${esc(b.names)}</p>
      <span class="cx-stamp" aria-hidden="true">בוטל</span>
    </div>`;
  const again = `<a class="cx-btn dark" href="index.html#treat"><svg class="icon"><use href="#i-cal"/></svg>לקבוע תור חדש</a>`;
  const write = (text, label) => `<a class="cx-btn line" href="${waLink(text)}" target="_blank" rel="noopener"><svg class="icon fill"><use href="#i-wa"/></svg>${label || 'לכתוב לאביגיל'}</a>`;

  const render = (b) => {
    if (b.state === 'open') {
      show(`<h1>היי ${esc(b.name)}, זה התור שלך</h1>${ticket(b)}
        <div id="cxAct">
          <button type="button" class="cx-btn dark" id="cxCancel">לבטל את התור</button>
          ${write(`היי אביגיל, אני רוצה להזיז את התור שלי (${short(b)})`, 'רוצה רק להזיז? כתבי לי')}
        </div>
        <p class="cx-note"><svg class="icon"><use href="#i-clock"/></svg>אפשר לבטל כאן עד 19:00 בערב שלפני התור</p>`);
      document.getElementById('cxCancel').addEventListener('click', () => confirmStep(b));
    } else if (b.state === 'late') {
      show(`<h1>היי ${esc(b.name)}</h1>${ticket(b)}
        <p class="cx-txt">ביטול דרך האתר אפשרי עד 19:00 בערב שלפני התור, וזה כבר עבר. כתבי לי ונראה מה אפשר לעשות.</p>
        ${write(`היי אביגיל, לגבי התור שלי (${short(b)})`)}`);
    } else if (b.state === 'cancelled') {
      show(`<h1>התור הזה כבר בוטל</h1>${ticket(b)}<p class="cx-txt">כשתרצי לקבוע מחדש, אני כאן.</p>${again}`);
      document.getElementById('cxTk').classList.add('void');
    } else if (b.state === 'past') {
      show(`<h1>התור הזה כבר עבר</h1>${ticket(b)}${again}`);
    }
  };

  const confirmStep = (b) => {
    const act = document.getElementById('cxAct');
    act.innerHTML = `<p class="cx-ask">לבטל את התור של ${esc(short(b).replace('בשעה ', 'ב־'))}?</p>
      <button type="button" class="cx-btn dark" id="cxYes">כן, לבטל</button>
      <button type="button" class="cx-btn line" id="cxNo">לא, אני משאירה אותו</button>`;
    act.classList.remove('cx-in'); void act.offsetWidth; act.classList.add('cx-in');
    document.getElementById('cxNo').addEventListener('click', () => render(b));
    document.getElementById('cxYes').addEventListener('click', async (e) => {
      const btn = e.currentTarget; btn.classList.add('busy');
      try {
        const r = demo ? (await new Promise((res) => setTimeout(res, 800)), { ok: true }) : await post({ action: 'cancel', t });
        if (r && r.ok) return cancelled();
        if (r && r.error === 'late') return render({ ...b, state: 'late' });
        throw new Error(r && r.error);
      } catch (err) {
        btn.classList.remove('busy');
        act.insertAdjacentHTML('beforeend', `<p class="cx-txt" style="margin-top:12px">משהו לא עבד. אפשר לכתוב לי ואבטל בשבילך.</p>${write(`היי אביגיל, אני רוצה לבטל את התור שלי (${short(b)})`)}`);
      }
    });
  };

  const cancelled = () => {
    document.getElementById('cxTk').classList.add('void');
    const act = document.getElementById('cxAct');
    act.innerHTML = `<p class="cx-txt">שלחתי לך אישור בוואטסאפ. כשתרצי לקבוע מחדש, אני כאן.</p>${again}`;
    act.classList.remove('cx-in'); void act.offsetWidth; act.classList.add('cx-in');
    const note = box.querySelector('.cx-note'); if (note) note.remove();
    const h = box.querySelector('h1'); if (h) h.textContent = 'התור בוטל';
  };

  const post = async (body) => (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })).json();
  const notFound = () => show(`<h1>לא מצאתי את התור</h1><p class="cx-txt">אולי הקישור לא הועתק עד הסוף. כתבי לי ואבדוק בשבילך.</p>${write('היי אביגיל, ניסיתי לפתוח את הקישור לביטול התור')}`);

  if (demo) {
    const d = new Date(Date.now() + 3 * 864e5), DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    if (d.getDay() > 4) d.setDate(d.getDate() + (7 - d.getDay()));
    const p2 = (n) => String(n).padStart(2, '0');
    render({ state: t === 'demo-late' ? 'late' : t === 'demo-cancelled' ? 'cancelled' : 'open', name: 'נועה', day: DAY[d.getDay()], date: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`, time: '10:30', end: '11:15', names: 'עיצוב גבות טבעיות + צבע גבות' });
    return;
  }
  if (!/^[a-f0-9]{16}$/.test(t)) return notFound();
  fetch(`${API}?action=booking&t=${encodeURIComponent(t)}`).then((r) => r.json()).then((b) => (b && b.ok ? render(b) : notFound())).catch(notFound);
})();
</script>
</body>
</html>
